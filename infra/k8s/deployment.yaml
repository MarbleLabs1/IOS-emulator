# The manager keeps VM state in memory and VMs run inside the pod, so it must run as a single replica.
# Create the secret first:
#   kubectl create secret generic qemu-manager --from-literal=token="$(openssl rand -hex 32)"
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qemu-ios-emulator-manager
  labels:
    app: qemu-ios-emulator
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qemu-ios-emulator
  template:
    metadata:
      labels:
        app: qemu-ios-emulator
    spec:
      containers:
        - name: manager
          image: qemu-ios-emulator/manager:latest
          ports:
            - containerPort: 8080
          env:
            - name: MANAGER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: qemu-manager
                  key: token
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/qemu-ios-emulator
            - name: logs
              mountPath: /var/log/qemu-ios-emulator
      volumes:
        - name: data
          emptyDir: {}
        - name: logs
          emptyDir: {}
