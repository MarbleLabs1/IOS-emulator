[supervisord]
nodaemon=true
user=root
logfile=/app/logs/supervisord.log
pidfile=/var/run/supervisord.pid

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stderr_logfile=/app/logs/nginx.err.log
stdout_logfile=/app/logs/nginx.out.log
user=root

[program:backend]
command=node server.js
directory=/app/backend
autostart=true
autorestart=true
stderr_logfile=/app/logs/backend.err.log
stdout_logfile=/app/logs/backend.out.log
user=appuser
environment=NODE_ENV=production,PORT=3001

[program:novnc]
command=websockify --web=/usr/share/novnc/ 6080 localhost:5900
autostart=true
autorestart=true
stderr_logfile=/app/logs/novnc.err.log
stdout_logfile=/app/logs/novnc.out.log
user=appuser

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

